---
layout: default
---
<section class="hero">
  <h2>はじめまして</h2>
  <p>透明水彩とペンで描いた絵をまとめています。</p>
</section>

<section id="works" class="works">
  <h2>作品</h2>
  {% assign works = site.data.works | sort: "id" | reverse %}
  <div class="works-layout">
    <ul class="feed">
      {% for work in works %}
      <li class="feed-item" style="--w: {{ work.width }}; --h: {{ work.height }};">
        <figure class="feed-figure">
          <a href="{{ work.image | relative_url }}"
             data-year="{{ work.year }}"
             data-tools="{{ work.tools | escape }}"
             {% if work.title %}data-title="{{ work.title | escape }}"{% endif %}>
            <img src="{{ work.image | relative_url }}"
                 width="{{ work.width }}" height="{{ work.height }}"
                 alt="{{ work.alt | escape }}"
                 {% if forloop.first %}fetchpriority="high"{% else %}loading="lazy"{% endif %}
                 decoding="async">
          </a>
          <figcaption class="feed-caption">{% if work.title %}{{ work.title }} · {% endif %}{{ work.year }} · {{ work.tools }}</figcaption>
        </figure>
      </li>
      {% endfor %}
    </ul>
    <aside class="feed-info" aria-hidden="true" hidden>
      <p class="feed-year"></p>
      <p class="feed-title"></p>
      <p class="feed-tools"></p>
    </aside>
  </div>
</section>

<section id="about">
  <h2>自己紹介</h2>
  <p>ここに自己紹介を書きます。（仮）</p>
</section>

<section id="contact">
  <h2>連絡先</h2>
  <p>GitHub: <a href="https://github.com/sii-nph">github.com/sii-nph</a></p>
</section>

<dialog id="lightbox" class="lightbox" aria-label="作品の拡大表示">
  <div class="lightbox-inner">
    <button type="button" class="lightbox-button lightbox-close" data-action="close" aria-label="閉じる">&times;</button>
    <button type="button" class="lightbox-button lightbox-prev" data-action="prev" aria-label="前の作品">&lsaquo;</button>
    <button type="button" class="lightbox-button lightbox-next" data-action="next" aria-label="次の作品">&rsaquo;</button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
  </div>
</dialog>
